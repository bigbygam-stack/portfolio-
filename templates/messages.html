{% extends "base.html" %}
{% block title %}Inbox{% endblock %}

{% block content %}
<section class="section">
  <h2>Messages</h2>
  {% if messages %}
    <div class="inbox">
      {% for m in messages %}
        <article class="card">
          <h3>{{ m.name }} <small>&lt;{{ m.email }}&gt;</small></h3>
          <p>{{ m.message }}</p>
          <small>{{ m.created_at }}</small>
        </article>
      {% endfor %}
    </div>
  {% else %}
    <p>No messages yet.</p>
  {% endif %}
</section>
{% endblock %}
